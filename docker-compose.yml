services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: summa
      POSTGRES_PASSWORD: summa
      POSTGRES_DB: summa
    ports:
      - "5433:5432"
    volumes:
      - summa-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summa -d summa"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  summa-db:
