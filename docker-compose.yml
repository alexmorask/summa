services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: summa
      POSTGRES_PASSWORD: summa
      POSTGRES_DB: summa
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - summa-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U summa -d summa"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  summa-db:
