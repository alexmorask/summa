services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: summa
      POSTGRES_PASSWORD: summa
      POSTGRES_DB: summa
    ports:
      - "5432:5432"
    volumes:
      - summa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summa -d summa"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Summa.Ledger.Api/Dockerfile
    environment:
      ConnectionStrings__Summa: "Host=postgres;Port=5432;Username=summa;Password=summa;Database=summa"
      Authentication__Authority: "https://login.microsoftonline.com/785523cd-52b4-4167-a4e6-9f116d688c0f/v2.0"
      Authentication__Audience: "e62638d3-642a-4f30-bc78-1d1fdff3634a"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  projections:
    build:
      context: .
      dockerfile: src/Summa.Ledger.Projections/Dockerfile
    environment:
      ConnectionStrings__Summa: "Host=postgres;Port=5432;Username=summa;Password=summa;Database=summa"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  summa-postgres-data:
