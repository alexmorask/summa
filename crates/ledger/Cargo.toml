[package]
name = "ledger"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros", "migrate"] }
tokio = { version = "1.54", optional = true }

[features]
# Exposes `UnpostedTransaction::post_for_tests` to the ledger's own integration tests.
test-support = []
# Stores the ledger in PostgreSQL (`store` module).
postgres = ["dep:sqlx", "dep:tokio", "chrono/clock"]

[dev-dependencies]
# The crate depends on itself so its integration tests build with `test-support`; `cargo build` leaves it off.
ledger = { path = ".", features = ["test-support", "postgres"] }
proptest = "1.12"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
